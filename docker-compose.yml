version: '3.8'

services:
  orchestrator:
    build: .
    volumes:
      - .:/app
    environment:
      - PYTHONPATH=/app/src
      - LOG_LEVEL=DEBUG
    command: python -m autonomous_fleet_orchestrator.agent.fleet_commander

  mock_ros2_node:
    build: .
    command: python -m autonomous_fleet_orchestrator.ros2_interface.action_server_bridge
    environment:
      - PYTHONPATH=/app/src
      - NODE_NAME=mock_ros2_bridge
