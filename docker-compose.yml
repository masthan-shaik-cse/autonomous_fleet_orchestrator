version: '3.8'

services:
  orchestrator:
    build: .
    volumes:
      - .:/app
    environment:
      - PYTHONPATH=/app
      - LOG_LEVEL=DEBUG
    command: python -m agent.fleet_commander

  mock_ros2_node:
    build: .
    command: python -m ros2_interface.action_server_bridge
    environment:
      - PYTHONPATH=/app
      - NODE_NAME=mock_ros2_bridge
