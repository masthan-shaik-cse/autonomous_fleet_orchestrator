[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "autonomous_fleet_orchestrator"
version = "1.0.0"
description = "A Multi-Agent LLM Orchestration system for Autonomous Fleet Management with Constitutional AI alignment."
authors = [{ name = "Masthan Shaik", email = "masthan@example.com" }]
requires-python = ">=3.9"
dependencies = [
    "pydantic>=2.0.0",
    "numpy>=1.24.0",
    "scipy>=1.10.0",
    "loguru>=0.7.0",
    "pyyaml>=6.0",
    "pytest>=7.0.0"
]

[project.optional-dependencies]
dev = ["black", "flake8", "mypy", "pytest"]

[tool.pytest.ini_options]
minversion = "7.0"
addopts = "-ra -q"
testpaths = ["tests"]
